<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Darren Level 11 Surprise</title>

<style>
body {
    background: #0d0d0d;
    text-align: center;
    font-family: Arial, sans-serif;
    color: white;
    margin: 0;
}

h1 {
    margin-top: 30px;
}

/* Center images properly */
img {
    display: block;
    max-width: 90%;
    border-radius: 20px;
    margin: 40px auto 0 auto;
    cursor: pointer;
    transition: transform 0.4s ease, opacity 0.5s ease;
}

img:hover {
    transform: scale(1.03);
}

/* Card hidden initially */
#card {
    display: none;
    opacity: 0;
    transform: translateX(60vw); /* Start off screen */
}

/* Fly-in animation */
.flyIn {
    animation: flyIn 0.9s cubic-bezier(.2,.9,.2,1) forwards;
}

@keyframes flyIn {
    from {
        opacity: 0;
        transform: translateX(60vw) scale(0.96);
    }
    to {
        opacity: 1;
        transform: translateX(0) scale(1);
    }
}
</style>
</head>

<body>

<h1>Tap the Chest to Unlock Your Level 11 Surprise 🎮🏈</h1>

<!-- Chest -->
<img id="chest" src="chest.png" onclick="openCard()">

<!-- Birthday Card -->
<img id="card" src="card.png">

<!-- Level Up Sound -->
<audio id="levelSound" src="levelup.mp3" preload="auto"></audio>

<script>
function openCard() {

    var sound = document.getElementById("levelSound");
    sound.currentTime = 0;
    sound.play().catch(function(e) {
        console.log("Sound blocked:", e);
    });

    var chest = document.getElementById("chest");
    chest.style.opacity = "0";

    setTimeout(function() {
        chest.style.display = "none";
        var card = document.getElementById("card");
        card.style.display = "block";
        card.classList.add("flyIn");
    }, 800);
}
</script>

</body>
</html>
